name: Apply shared visual system

on:
  push:
    paths:
      - '.github/workflows/apply-visual-system.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link shared stylesheet to all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = ['index.html','origin.html','consult.html','notes.html','scenes.html','objects.html','connect.html','404.html']
          tag = '<link rel="stylesheet" href="site.css" />'
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if tag in s:
                  continue
              if '</style>' in s:
                  s = s.replace('</style>', '</style>\n  ' + tag, 1)
              else:
                  s = s.replace('</head>', '  ' + tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit visual system links
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html origin.html consult.html notes.html scenes.html objects.html connect.html 404.html
          git commit -m "Connect shared visual system across site"
          git push
