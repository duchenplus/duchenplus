<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DU/CHEN+→ — Culture × Life × Love × Technology" />
  <title>DU/CHEN+→</title>
  <style>
    :root {
      --bg: #efeee8;
      --text: #24302f;
      --muted: #69716e;
      --line: rgba(36,48,47,0.16);
      --accent: #5f776f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .brand-small,
    .brand-footer {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      color: var(--accent);
      font-weight: 500;
    }

    .status {
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 54px 0 72px;
    }

    .hero {
      width: 100%;
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 72px;
      align-items: end;
    }

    .kicker {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(64px, 8.4vw, 118px);
      line-height: 0.82;
      letter-spacing: -0.075em;
      font-weight: 800;
      margin-left: -0.06em;
      white-space: nowrap;
    }

    h1 .brand-mark {
      display: inline-block;
      margin-left: 0.03em;
      font-size: 0.68em;
      letter-spacing: -0.1em;
      transform: translateY(-0.06em);
    }

    .slash {
      color: var(--accent);
      font-weight: 400;
    }

    .manifesto {
      margin-top: 34px;
      max-width: 700px;
      font-size: clamp(18px, 2vw, 29px);
      line-height: 1.4;
      letter-spacing: -0.025em;
    }

    .manifesto span {
      white-space: nowrap;
    }

    .language-kicker {
      display: flex;
      align-items: center;
      gap: 0.6em;
      width: max-content;
      margin: 12px 0 9px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(12px, 0.9vw, 13px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.14em;
      color: var(--accent);
    }

    .language-kicker::after {
      content: "";
      width: 44px;
      height: 1px;
      margin-left: 2px;
      background: currentColor;
      opacity: 0.58;
    }

    .language-kicker .select-slash {
      color: var(--text);
      font-weight: 500;
    }

    .bridges {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.2vw, 30px);
      margin: 2px 0 16px;
      color: var(--muted);
    }

    .bridge-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: color 180ms ease, transform 180ms ease;
    }

    .bridge-icon:hover,
    .bridge-icon:focus-visible {
      color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }

    .bridge-icon svg {
      width: clamp(58px, 5vw, 72px);
      height: auto;
      overflow: visible;
    }

    .bridge-icon path,
    .bridge-icon line,
    .bridge-icon polyline {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .bridge-label {
      position: absolute;
      top: calc(100% + 1px);
      left: 50%;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -2px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .bridge-icon:hover .bridge-label,
    .bridge-icon:focus-visible .bridge-label {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    nav {
      border-top: 1px solid var(--line);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      font-size: clamp(22px, 2.6vw, 38px);
      letter-spacing: -0.04em;
      transition: padding-left 180ms ease, color 180ms ease;
    }

    .nav-item:hover {
      padding-left: 10px;
      color: var(--accent);
    }

    .nav-item::after {
      content: "↗";
      font-size: 18px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .nav-item:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    .symbol {
      display: inline-block;
      min-width: 92px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.66em;
      color: var(--muted);
      letter-spacing: -0.02em;
    }

    .nav-item:hover .symbol {
      color: var(--accent);
    }

    footer {
      padding: 18px 0 28px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 54px;
      }

      main {
        align-items: flex-start;
        padding-top: 72px;
      }

      h1 {
        font-size: clamp(54px, 14vw, 78px);
      }

      .symbol {
        min-width: 74px;
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 26px, 1180px);
      }

      header {
        padding-top: 18px;
      }

      .status {
        display: none;
      }

      .manifesto {
        font-size: 19px;
      }

      .nav-item {
        font-size: 25px;
        padding: 17px 0;
      }

      .symbol {
        min-width: 68px;
      }

      footer {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand-small">DU/CHEN<span class="brand-mark">+→</span></div>
      <div class="status">Tokyo · Online</div>
    </header>

    <main>
      <section class="hero">
        <div>
          <div class="kicker">a personal space / always evolving</div>
          <h1>DU<span class="slash">/</span>CHEN<span class="brand-mark">+→</span></h1>
          <p class="manifesto">
            <span>culture × life × love × technology</span>
            <span class="language-kicker"><span>SELECT</span><span class="select-slash">/</span><span>BRIDGE</span></span>
            <span class="bridges" role="group" aria-label="Language selection">
              <button class="bridge-icon" type="button" aria-label="中文" data-lang="zh">
                <svg viewBox="0 0 72 34" aria-hidden="true">
                  <path d="M4 28h64M8 27c7-1 11-5 15-11 4-6 8-9 13-9s9 3 13 9c4 6 8 10 15 11" />
                  <path d="M14 23v5M58 23v5M27 12h18M31 8l5-4 5 4M29 8h14v4H29z" />
                </svg>
                <span class="bridge-label">中文</span>
              </button>
              <button class="bridge-icon" type="button" aria-label="Français" data-lang="fr">
                <svg viewBox="0 0 72 34" aria-hidden="true">
                  <path d="M4 28h64M7 23h58M9 23c3-9 9-13 16-13s13 4 16 13M41 23c3-7 7-10 12-10s9 3 12 10" />
                  <path d="M8 18v10M66 18v10M7 18h3M65 18h3M9 14v4M67 14v4" />
                </svg>
                <span class="bridge-label">Français</span>
              </button>
              <button class="bridge-icon" type="button" aria-label="English" data-lang="en">
                <svg viewBox="0 0 72 34" aria-hidden="true">
                  <path d="M4 28h64M5 22h62M14 22V9h10v13M48 22V9h10v13" />
                  <path d="M13 9l6-5 6 5M47 9l6-5 6 5M24 13c7 0 9 5 12 5s5-5 12-5M19 9v13M53 9v13" />
                </svg>
                <span class="bridge-label">English</span>
              </button>
              <button class="bridge-icon" type="button" aria-label="日本語" data-lang="ja">
                <svg viewBox="0 0 72 34" aria-hidden="true">
                  <path d="M4 28h64M8 24c8 0 12-2 17-6 4-3 7-5 11-5s7 2 11 5c5 4 9 6 17 6" />
                  <path d="M10 20v8M62 20v8M15 22v6M57 22v6M8 19h8M56 19h8M10 16v3M62 16v3" />
                </svg>
                <span class="bridge-label">日本語</span>
              </button>
            </span>
            <span>shedding / growth</span>
          </p>
        </div>

        <nav aria-label="Primary">
          <a class="nav-item" href="origin.html">
            <span><span class="symbol">&lt;&gt;</span>Origin</span>
          </a>
          <a class="nav-item" href="#consult">
            <span><span class="symbol">/ +</span>Consult</span>
          </a>
          <a class="nav-item" href="#notes">
            <span><span class="symbol">//</span>Notes</span>
          </a>
          <a class="nav-item" href="#life">
            <span><span class="symbol">♥</span>Life</span>
          </a>
          <a class="nav-item" href="mailto:hello@duchenplus.com">
            <span><span class="symbol">→</span>Connect</span>
          </a>
        </nav>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> <span class="brand-footer">DU/CHEN<span class="brand-mark">+→</span></span></span>
      <span>culture / life / love / technology</span>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.querySelectorAll(".bridge-icon[data-lang]").forEach((bridge) => {
      bridge.addEventListener("click", () => {
        const language = bridge.dataset.lang;
        localStorage.setItem("duchen-language", language);
        window.location.href = `origin.html?lang=${language}`;
      });
    });
  </script>
</body>
</html>
