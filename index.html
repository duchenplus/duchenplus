<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DUCHEN+ — Technology × Love × Culture × Art × Life" />
  <title>DUCHEN+</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #111111;
      --muted: #6d6a64;
      --line: rgba(17,17,17,0.16);
      --accent: #ff6b00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .brand-small {
      font-weight: 700;
    }

    .status {
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 54px 0 72px;
    }

    .hero {
      width: 100%;
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 72px;
      align-items: end;
    }

    .kicker {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(72px, 12vw, 170px);
      line-height: 0.82;
      letter-spacing: -0.075em;
      font-weight: 800;
      margin-left: -0.06em;
    }

    .plus {
      color: var(--accent);
      font-weight: 500;
    }

    .manifesto {
      margin-top: 34px;
      max-width: 700px;
      font-size: clamp(18px, 2vw, 29px);
      line-height: 1.4;
      letter-spacing: -0.025em;
    }

    .manifesto span {
      white-space: nowrap;
    }

    nav {
      border-top: 1px solid var(--line);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      font-size: clamp(22px, 2.6vw, 38px);
      letter-spacing: -0.04em;
      transition: padding-left 180ms ease, color 180ms ease;
    }

    .nav-item:hover {
      padding-left: 10px;
      color: var(--accent);
    }

    .nav-item::after {
      content: "↗";
      font-size: 18px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .nav-item:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    .symbol {
      display: inline-block;
      min-width: 92px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.66em;
      color: var(--muted);
      letter-spacing: -0.02em;
    }

    .nav-item:hover .symbol {
      color: var(--accent);
    }

    footer {
      padding: 18px 0 28px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 54px;
      }

      main {
        align-items: flex-start;
        padding-top: 72px;
      }

      h1 {
        font-size: clamp(70px, 24vw, 120px);
      }

      .symbol {
        min-width: 74px;
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 26px, 1180px);
      }

      header {
        padding-top: 18px;
      }

      .status {
        display: none;
      }

      .manifesto {
        font-size: 19px;
      }

      .nav-item {
        font-size: 25px;
        padding: 17px 0;
      }

      .symbol {
        min-width: 68px;
      }

      footer {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand-small">DUCHEN+</div>
      <div class="status">Tokyo · Online</div>
    </header>

    <main>
      <section class="hero">
        <div>
          <div class="kicker">Personal space / evolving system</div>
          <h1>DUCHEN<span class="plus">+</span></h1>
          <p class="manifesto">
            <span>Technology</span> ×
            <span>Love</span> ×
            <span>Culture</span> ×
            <span>Art</span> ×
            <span>Life</span>
          </p>
        </div>

        <nav aria-label="Primary">
          <a class="nav-item" href="#origin">
            <span><span class="symbol">&lt;&gt;</span>Origin</span>
          </a>
          <a class="nav-item" href="#consult">
            <span><span class="symbol">/ +</span>Consult</span>
          </a>
          <a class="nav-item" href="#notes">
            <span><span class="symbol">//</span>Notes</span>
          </a>
          <a class="nav-item" href="#life">
            <span><span class="symbol">♥</span>Life</span>
          </a>
          <a class="nav-item" href="mailto:hello@duchenplus.com">
            <span><span class="symbol">→</span>Connect</span>
          </a>
        </nav>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> DUCHEN+</span>
      <span>Technology · Love · Culture · Art · Life</span>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
